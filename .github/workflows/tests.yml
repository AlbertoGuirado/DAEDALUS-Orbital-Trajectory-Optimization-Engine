name: Tests

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e .
      - name: Unit and analytic validation tests
        run: python -m unittest discover -s tests -v

  reference-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference dependencies and plots
        run: python -m pip install -r requirements-reproducible.txt -e '.[plots]'
      - name: Run deterministic Earth orbit example
        run: python -m experiments.validate_two_body --config configs/earth_orbit.json --output outputs/earth_orbit --plots
      - name: Upload measured validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-earth-orbit
          path: outputs/earth_orbit/
          if-no-files-found: warn
