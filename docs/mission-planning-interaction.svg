<svg xmlns="http://www.w3.org/2000/svg" width="1980" height="4109" viewBox="0 0 1980 4109" role="img" aria-labelledby="title desc"><title id="title">Mission planning: interacciones de fases 1 y 2</title><desc id="desc">Usuario a la izquierda y ocho entidades en columnas verticales. Las llamadas y respuestas se leen de arriba abajo. Exportación circular actual y visualización de transferencias futura.</desc><style>text{font-family:Segoe UI,Arial,sans-serif}</style><defs><marker id="call" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6adfc4" stroke-width="1.3"/></marker><marker id="reply" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#9cabbc" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#091522"/><line x1="145" y1="90" x2="145" y2="4084" stroke="#2c4258" stroke-dasharray="4 7"/><line x1="385" y1="90" x2="385" y2="4084" stroke="#2c4258" stroke-dasharray="4 7"/><line x1="625" y1="90" x2="625" y2="4084" stroke="#2c4258" stroke-dasharray="4 7"/><line x1="865" y1="90" x2="865" y2="4084" stroke="#2c4258" stroke-dasharray="4 7"/><line x1="1105" y1="90" x2="1105" y2="4084" stroke="#2c4258" stroke-dasharray="4 7"/><line x1="1345" y1="90" x2="1345" y2="4084" stroke="#2c4258" stroke-dasharray="4 7"/><line x1="1585" y1="90" x2="1585" y2="4084" stroke="#2c4258" stroke-dasharray="4 7"/><line x1="1825" y1="90" x2="1825" y2="4084" stroke="#2c4258" stroke-dasharray="4 7"/><rect x="22" y="290" width="1936" height="249" rx="8" fill="none" stroke="#34516a" stroke-dasharray="5 5"/><rect x="22" y="712" width="1936" height="230" rx="8" fill="none" stroke="#34516a" stroke-dasharray="5 5"/><rect x="22" y="1205" width="1936" height="192" rx="8" fill="none" stroke="#34516a" stroke-dasharray="5 5"/><rect x="22" y="3777" width="1936" height="259" rx="8" fill="none" stroke="#34516a" stroke-dasharray="5 5"/><rect x="37" y="20" width="216" height="70" rx="10" fill="#14283a" stroke="#43708e"/><text x="145" y="47" text-anchor="middle" fill="#eef6ff" font-size="15"><tspan x="145" dy="0">Usuario / input</tspan></text><rect x="277" y="20" width="216" height="70" rx="10" fill="#14283a" stroke="#43708e"/><text x="385" y="47" text-anchor="middle" fill="#eef6ff" font-size="15"><tspan x="385" dy="0">Script de misión</tspan></text><rect x="517" y="20" width="216" height="70" rx="10" fill="#14283a" stroke="#43708e"/><text x="625" y="47" text-anchor="middle" fill="#eef6ff" font-size="15"><tspan x="625" dy="0">Geometría y mecánica</tspan><tspan x="625" dy="19">orbital</tspan></text><rect x="757" y="20" width="216" height="70" rx="10" fill="#14283a" stroke="#43708e"/><text x="865" y="47" text-anchor="middle" fill="#eef6ff" font-size="15"><tspan x="865" dy="0">Baseline Hohmann</tspan></text><rect x="997" y="20" width="216" height="70" rx="10" fill="#14283a" stroke="#43708e"/><text x="1105" y="47" text-anchor="middle" fill="#eef6ff" font-size="15"><tspan x="1105" dy="0">Aplicación de impulsos</tspan></text><rect x="1237" y="20" width="216" height="70" rx="10" fill="#14283a" stroke="#43708e"/><text x="1345" y="47" text-anchor="middle" fill="#eef6ff" font-size="15"><tspan x="1345" dy="0">Propagación RK4 / RK45</tspan></text><rect x="1477" y="20" width="216" height="70" rx="10" fill="#14283a" stroke="#43708e"/><text x="1585" y="47" text-anchor="middle" fill="#eef6ff" font-size="15"><tspan x="1585" dy="0">Dinámica de dos cuerpos</tspan></text><rect x="1717" y="20" width="216" height="70" rx="10" fill="#14283a" stroke="#43708e"/><text x="1825" y="47" text-anchor="middle" fill="#eef6ff" font-size="15"><tspan x="1825" dy="0">Resultados y</tspan><tspan x="1825" dy="19">visualización</tspan></text><rect x="30" y="135" width="1920" height="44" rx="8" fill="#10362f" stroke="#2b7660"/><text x="990.0" y="160" text-anchor="middle" fill="#86efce" font-size="16"><tspan x="990.0" dy="0">Fase 1 — definir y estudiar una órbita</tspan></text><text x="265.0" y="217" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="265.0" dy="0">1. Órbita inicial, mu,</tspan><tspan x="265.0" dy="19">duración y opciones numéricas</tspan></text><path d="M 145 251 H 385" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="38" y="310" text-anchor="start" fill="#9ac8ef" font-size="13"><tspan x="38" dy="0">OPCIONAL · Entrada mediante elementos clásicos</tspan></text><text x="505.0" y="349" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="505.0" dy="0">2.</tspan><tspan x="505.0" dy="19">elements_to_state(elementos,</tspan><tspan x="505.0" dy="19">mu)</tspan></text><path d="M 385 402 H 625" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="505.0" y="456" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="505.0" dy="0">3. Estado inicial cartesiano</tspan><tspan x="505.0" dy="19">(6,)</tspan></text><path d="M 625 490 H 385" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="865.0" y="572" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="865.0" dy="0">4. propagate(estado, duración, mu, opciones)</tspan></text><path d="M 385 587 H 1345" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><rect x="1241" y="626" width="208" height="63" rx="8" fill="#2b2830" stroke="#695d44"/><text x="1345.0" y="651" text-anchor="middle" fill="#ffd492" font-size="13"><tspan x="1345.0" dy="0">Validar entradas y dominio</tspan><tspan x="1345.0" dy="19">elíptico</tspan></text><text x="38" y="732" text-anchor="start" fill="#9ac8ef" font-size="13"><tspan x="38" dy="0">BUCLE · Evaluaciones del integrador</tspan></text><text x="1465.0" y="771" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="1465.0" dy="0">5. two_body_dynamics(t,</tspan><tspan x="1465.0" dy="19">estado, mu)</tspan></text><path d="M 1345 805 H 1585" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="1465.0" y="859" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="1465.0" dy="0">6. Derivada de posición y</tspan><tspan x="1465.0" dy="19">velocidad</tspan></text><path d="M 1585 893 H 1345" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="865.0" y="975" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="865.0" dy="0">7. PropagationResult: tiempos y estados</tspan></text><path d="M 1345 990 H 385" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="505.0" y="1044" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="505.0" dy="0">8. Calcular elementos e</tspan><tspan x="505.0" dy="19">invariantes de los estados</tspan></text><path d="M 385 1078 H 625" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="505.0" y="1132" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="505.0" dy="0">9. Elementos, energía, momento</tspan><tspan x="505.0" dy="19">angular y excentricidad</tspan></text><path d="M 625 1166 H 385" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="38" y="1225" text-anchor="start" fill="#9ac8ef" font-size="13"><tspan x="38" dy="0">OPCIONAL · Experimento circular existente</tspan></text><text x="1105.0" y="1264" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="1105.0" dy="0">10. Trayectoria, referencia circular y métricas</tspan></text><path d="M 385 1279 H 1825" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="985.0" y="1333" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="985.0" dy="0">11. CSV y JSON; PNG al activar plots</tspan></text><path d="M 1825 1348 H 145" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><rect x="30" y="1415" width="1920" height="44" rx="8" fill="#10362f" stroke="#2b7660"/><text x="990.0" y="1440" text-anchor="middle" fill="#86efce" font-size="16"><tspan x="990.0" dy="0">Fase 2 — calcular y comprobar una transferencia</tspan></text><rect x="281" y="1482" width="1648" height="44" rx="8" fill="#2b2830" stroke="#695d44"/><text x="1105.0" y="1507" text-anchor="middle" fill="#ffd492" font-size="13"><tspan x="1105.0" dy="0">Composición mediante script o tests; no existe un planificador integrado</tspan></text><text x="265.0" y="1564" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="265.0" dy="0">12. Radios circulares</tspan><tspan x="265.0" dy="19">coplanarios, orientación, masa</tspan><tspan x="265.0" dy="19">e Isp</tspan></text><path d="M 145 1617 H 385" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="625.0" y="1671" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="625.0" dy="0">13. hohmann_transfer(r1, r2, mu)</tspan></text><path d="M 385 1686 H 865" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="625.0" y="1740" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="625.0" dy="0">14. Módulos de los dos impulsos y tiempo de transferencia</tspan></text><path d="M 865 1755 H 385" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="405" y="1809" text-anchor="start" fill="#6adfc4" font-size="13"><tspan x="405" dy="0">15. Orientar el primer impulso</tspan><tspan x="405" dy="19">tangencial</tspan></text><path d="M 385 1841 h 32 v 26 h -32" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="745.0" y="1912" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="745.0" dy="0">16. Propagar con primer impulso hasta la llegada</tspan></text><path d="M 385 1927 H 1105" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="1125" y="1981" text-anchor="start" fill="#6adfc4" font-size="13"><tspan x="1125" dy="0">17. Sumar delta-v a la velocidad</tspan><tspan x="1125" dy="19">inicial</tspan></text><path d="M 1105 2013 h 32 v 26 h -32" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="1225.0" y="2084" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="1225.0" dy="0">18. propagate(estado posterior</tspan><tspan x="1225.0" dy="19">al impulso, tiempo, mu)</tspan></text><path d="M 1105 2118 H 1345" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="1465.0" y="2172" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="1465.0" dy="0">19. Evaluar dinámica durante</tspan><tspan x="1465.0" dy="19">el vuelo libre</tspan></text><path d="M 1345 2206 H 1585" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="1465.0" y="2260" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="1465.0" dy="0">20. Derivadas de los estados</tspan></text><path d="M 1585 2275 H 1345" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1225.0" y="2329" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="1225.0" dy="0">21. Estado a la llegada</tspan></text><path d="M 1345 2344 H 1105" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="745.0" y="2398" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="745.0" dy="0">22. Estado previo al segundo impulso</tspan></text><path d="M 1105 2413 H 385" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="405" y="2467" text-anchor="start" fill="#6adfc4" font-size="13"><tspan x="405" dy="0">23. Orientar el segundo impulso con la</tspan><tspan x="405" dy="19">velocidad de llegada</tspan></text><path d="M 385 2499 h 32 v 26 h -32" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="745.0" y="2570" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="745.0" dy="0">24. propagate_with_impulses(estado inicial, dos impulsos, tiempo)</tspan></text><path d="M 385 2585 H 1105" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><rect x="1001" y="2624" width="448" height="63" rx="8" fill="#2b2830" stroke="#695d44"/><text x="1225.0" y="2649" text-anchor="middle" fill="#ffd492" font-size="13"><tspan x="1225.0" dy="0">Repite el vuelo y aplica el segundo impulso al final,</tspan><tspan x="1225.0" dy="19">como en el test actual</tspan></text><text x="1225.0" y="2725" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="1225.0" dy="0">25. Propagar los tramos entre</tspan><tspan x="1225.0" dy="19">impulsos</tspan></text><path d="M 1105 2759 H 1345" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="1465.0" y="2813" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="1465.0" dy="0">26. Evaluar dinámica de vuelo</tspan><tspan x="1465.0" dy="19">libre</tspan></text><path d="M 1345 2847 H 1585" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="1465.0" y="2901" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="1465.0" dy="0">27. Derivadas de los estados</tspan></text><path d="M 1585 2916 H 1345" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1225.0" y="2970" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="1225.0" dy="0">28. Estado previo al impulso</tspan><tspan x="1225.0" dy="19">final</tspan></text><path d="M 1345 3004 H 1105" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="1125" y="3058" text-anchor="start" fill="#6adfc4" font-size="13"><tspan x="1125" dy="0">29. Aplicar el segundo delta-v sin</tspan><tspan x="1125" dy="19">cambiar la posición</tspan></text><path d="M 1105 3090 h 32 v 26 h -32" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="745.0" y="3161" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="745.0" dy="0">30. Estado final (6,), después del segundo impulso</tspan></text><path d="M 1105 3176 H 385" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="505.0" y="3230" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="505.0" dy="0">31. state_to_elements(estado</tspan><tspan x="505.0" dy="19">final, mu)</tspan></text><path d="M 385 3264 H 625" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="505.0" y="3318" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="505.0" dy="0">32. Semieje, excentricidad,</tspan><tspan x="505.0" dy="19">inclinación y demás elementos</tspan></text><path d="M 625 3352 H 385" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="405" y="3406" text-anchor="start" fill="#6adfc4" font-size="13"><tspan x="405" dy="0">33. Comparar órbita final con objetivo</tspan><tspan x="405" dy="19">y tolerancias</tspan></text><path d="M 385 3438 h 32 v 26 h -32" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="505.0" y="3509" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="505.0" dy="0">34. propellant_mass(masa</tspan><tspan x="505.0" dy="19">inicial, delta-v total, Isp)</tspan></text><path d="M 385 3543 H 625" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="505.0" y="3597" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="505.0" dy="0">35. Propelente ideal consumido</tspan><tspan x="505.0" dy="19">en kg</tspan></text><path d="M 625 3631 H 385" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="265.0" y="3685" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="265.0" dy="0">36. Coste, tiempo, consumo y</tspan><tspan x="265.0" dy="19">resultado de las</tspan><tspan x="265.0" dy="19">comprobaciones</tspan></text><path d="M 385 3738 H 145" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/><text x="38" y="3797" text-anchor="start" fill="#9ac8ef" font-size="13"><tspan x="38" dy="0">OPCIONAL · Conexión futura de presentación de misión</tspan></text><rect x="281" y="3821" width="1648" height="44" rx="8" fill="#2b2830" stroke="#695d44"/><text x="1105.0" y="3846" text-anchor="middle" fill="#ffd492" font-size="13"><tspan x="1105.0" dy="0">Requiere guardar tramos y desarrollar un informe o visor de transferencia</tspan></text><text x="1105.0" y="3903" text-anchor="middle" fill="#6adfc4" font-size="13"><tspan x="1105.0" dy="0">37. Trayectoria por tramos, maniobras y métricas</tspan></text><path d="M 385 3918 H 1825" fill="none" stroke="#6adfc4" stroke-width="1.8" marker-end="url(#call)"/><text x="985.0" y="3972" text-anchor="middle" fill="#9cabbc" font-size="13"><tspan x="985.0" dy="0">38. Informe y visualización de la transferencia propuestos</tspan></text><path d="M 1825 3987 H 145" fill="none" stroke="#9cabbc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#reply)"/></svg>